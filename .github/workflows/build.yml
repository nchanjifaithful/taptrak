name: Build APK

# Builds the APK on GitHub's servers (no local SDK needed) and publishes it
# to this repo's Releases, with a log of what changed. Runs on every push to
# main, or on demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, to list changes since the last release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes 'tools', which sdkmanager no longer offers.
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Load the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPTRAK_KEYSTORE_BASE64 }}
        run: |
          # Fail instead of signing with a throwaway key, which would break updates.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The TAPTRAK_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/taptrak.p12"
          echo "TAPTRAK_KEYSTORE=$RUNNER_TEMP/taptrak.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          TAPTRAK_KEYSTORE_PASSWORD: ${{ secrets.TAPTRAK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK and show its signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapTrak.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs TapTrak.apk | grep 'SHA-256'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: taptrak-debug
          path: TapTrak.apk

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            # The newest section of CHANGELOG.md.
            awk '/^## /{ if (found) exit; found=1 } found' CHANGELOG.md
            echo
            if [ -n "$previous" ]; then
              echo "### Commits since $previous"
              echo
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            else
              echo "### Commits"
              echo
              git log --no-merges --format='- %s (%h)'
            fi
            echo
            echo "---"
            echo "Built automatically by GitHub Actions. Download **TapTrak.apk** below and install it on your device (you may need to allow installs from your file manager)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.${{ github.run_number }}
          name: TapTrak v2.5.${{ github.run_number }}
          files: TapTrak.apk
          body_path: release-notes.md
